<!doctype html><html lang="de"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>BLOCKBRAIN Outlook Plugin</title><link rel="icon" href="assets/favicon.ico" type="image/x-icon"/><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script defer="defer" src="taskpane.bundle.js"></script></head><body><div id="app"><header class="header"><img src="assets/favicon.ico" alt="BLOCKBRAIN" class="header-icon"/> <span class="header-title">BLOCKBRAIN</span></header><section class="section draft-section"><label class="label" for="hints">Zusätzliche Hinweise <span class="optional">(optional)</span></label> <textarea id="hints" class="textarea" rows="3" placeholder="z.B. &quot;Antworte freundlich aber bestimmt&quot; oder &quot;Frage nach der Bestellnummer&quot;"></textarea> <button id="btn-generate" class="btn btn-primary"><span id="btn-icon">✨</span> <span id="btn-text">Antwort generieren</span></button><div id="status" class="status hidden"><div class="spinner" id="spinner"></div><p id="status-text">Generiere Antwort...</p></div><div id="result" class="result-section hidden"><label class="label">Generierter Entwurf</label> <textarea id="draft-text" class="textarea draft-textarea" rows="8" readonly="readonly"></textarea><div class="result-actions"><button id="btn-open-reply" class="btn btn-primary"><span>📧</span> <span>Reply öffnen</span></button> <button id="btn-copy" class="btn btn-secondary"><span>📋</span> <span id="copy-text">Kopieren</span></button></div></div></section><details class="section settings-section" id="settings-details"><summary class="settings-toggle"><span class="settings-icon">⚙️</span> Einstellungen</summary><div class="settings-body"><div class="field"><label class="label" for="cfg-url">API URL</label> <input id="cfg-url" class="input" type="url" placeholder="https://blocky.qa.theblockbrain.io"/></div><div class="field"><label class="label" for="cfg-token">Bearer Token</label> <input id="cfg-token" class="input" type="password" placeholder="Token eingeben..."/></div><div class="field"><label class="label" for="cfg-bot">Bot ID</label> <input id="cfg-bot" class="input" placeholder="Bot ID eingeben..."/></div><button id="btn-save" class="btn btn-secondary">💾 Einstellungen speichern</button><p id="save-status" class="save-status hidden">✅ Gespeichert</p></div></details><footer class="footer"><a href="https://blockbrain.ai/" target="_blank" rel="noopener noreferrer" class="powered-by"><span class="powered-by-text">Powered by</span> <img src="assets/favicon.ico" alt="" class="powered-by-icon"/> <span class="powered-by-brand">BLOCKBRAIN</span></a></footer></div></body></html>

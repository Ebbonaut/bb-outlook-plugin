<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLOCKBRAIN Outlook Plugin</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
</head>
<body>
  <div id="app">

    <!-- ========== HEADER ========== -->
    <header class="header">
      <img src="assets/blockbrain-logo.png" alt="BLOCKBRAIN" class="header-logo" />
    </header>

    <!-- ========== DRAFT SECTION ========== -->
    <section class="section draft-section">
      <label class="label" for="hints">Additional hints <span class="optional">(optional)</span></label>
      <textarea id="hints" class="textarea" rows="5"
        placeholder="e.g. &quot;Reply friendly but firm&quot; or &quot;Ask for the order number&quot;"></textarea>

      <button id="btn-generate" class="btn btn-primary">
        <span id="btn-icon">✨</span>
        <span id="btn-text">Generate reply</span>
      </button>

      <!-- Status-Anzeige (versteckt bis Klick) -->
      <div id="status" class="status hidden">
        <div class="spinner" id="spinner"></div>
        <p id="status-text">Generating reply...</p>
      </div>

      <!-- Ergebnis-Bereich (versteckt bis Antwort da) -->
      <div id="result" class="result-section hidden">
        <label class="label">Generated draft</label>
        <textarea id="draft-text" class="textarea draft-textarea" rows="8" readonly></textarea>
        <div class="result-actions">
          <button id="btn-open-reply" class="btn btn-primary">
            <span>📧</span> <span>Open reply</span>
          </button>
          <button id="btn-copy" class="btn btn-secondary">
            <span>📋</span> <span id="copy-text">Copy</span>
          </button>
        </div>
      </div>
    </section>

    <!-- ========== SETTINGS SECTION ========== -->
    <details class="section settings-section" id="settings-details">
      <summary class="settings-toggle">
        <span class="settings-icon">⚙️</span> Settings
      </summary>

      <div class="settings-body">
        <div class="field">
          <label class="label" for="cfg-url">API URL</label>
          <input id="cfg-url" class="input" type="url" placeholder="https://blocky.theblockbrain.ai" />
        </div>

        <div class="field">
          <label class="label" for="cfg-token">API Key</label>
          <input id="cfg-token" class="input" type="password" placeholder="Enter token..." />
        </div>

        <div class="field">
          <label class="label" for="cfg-bot">Bot ID</label>
          <input id="cfg-bot" class="input" type="text" placeholder="Enter Bot ID..." />
        </div>

        <div class="field">
          <label class="checkbox-row" for="cfg-system-prompt">
            <input id="cfg-system-prompt" type="checkbox" checked />
            <span class="label">Include system prompt</span>
          </label>
          <span class="checkbox-hint">Disable if the bot already has its own instructions (Initial Instructions).</span>
        </div>

        <button id="btn-save" class="btn btn-secondary">
          💾 Save settings
        </button>

        <p id="save-status" class="save-status hidden">✅ Saved</p>
      </div>
    </details>

    <!-- ========== FOOTER ========== -->
    <footer class="footer">
      <a href="https://blockbrain.ai/" target="_blank" rel="noopener noreferrer" class="powered-by">
        <span class="powered-by-text">Powered by</span>
        <img src="assets/blockbrain-logo.png" alt="BLOCKBRAIN" class="powered-by-logo" />
      </a>
    </footer>

  </div>
</body>
</html>
